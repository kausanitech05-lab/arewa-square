<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AREWA SQUARE — Page Not Found</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --green-deep: #0d2b1f; --green-mid: #1a4a30;
      --gold: #c9a84c; --gold-light: #e8c97a;
      --emerald: #2ecc71; --white: #f5f0e8; --white-dim: #c8bfa8;
    }
    body {
      font-family:'Nunito',sans-serif;
      background:var(--green-deep); color:var(--white);
      min-height:100vh; display:flex; flex-direction:column;
      align-items:center; justify-content:center; text-align:center;
      padding:24px; overflow:hidden;
    }
    body::before {
      content:''; position:fixed; inset:0;
      background-image:
        repeating-linear-gradient(45deg,transparent,transparent 40px,rgba(201,168,76,0.03) 40px,rgba(201,168,76,0.03) 41px),
        repeating-linear-gradient(-45deg,transparent,transparent 40px,rgba(201,168,76,0.03) 40px,rgba(201,168,76,0.03) 41px);
      pointer-events:none; z-index:0;
    }
    .container { position:relative; z-index:1; max-width:480px; }
    .logo { margin-bottom:32px; }
    .logo img { height:52px; width:52px; border-radius: 52px; object-fit:contain; }
    .logo-name {
      font-family:'Cinzel',serif; font-size:1.1rem; font-weight:700;
      color:var(--gold); letter-spacing:2px; display:block; margin-top:8px;
    }
    .error-code {
      font-family:'Cinzel',serif; font-size:7rem; font-weight:900;
      color:transparent; line-height:1;
      -webkit-text-stroke:2px var(--gold);
      margin-bottom:8px;
    }
    h1 { font-family:'Cinzel',serif; font-size:1.4rem; font-weight:700; color:var(--white); margin-bottom:14px; }
    p { font-size:0.95rem; color:var(--white-dim); line-height:1.7; margin-bottom:32px; }
    .btn-group { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    .btn-gold {
      padding:12px 28px; background:var(--gold); color:#080f0b;
      border:none; border-radius:6px; font-family:'Nunito',sans-serif;
      font-size:0.9rem; font-weight:800; cursor:pointer; text-decoration:none;
      transition:background 0.3s;
    }
    .btn-gold:hover { background:var(--gold-light); }
    .btn-outline {
      padding:12px 28px; background:transparent;
      border:1px solid rgba(201,168,76,0.4); color:var(--gold);
      border-radius:6px; font-family:'Nunito',sans-serif;
      font-size:0.9rem; font-weight:700; cursor:pointer; text-decoration:none;
      transition:all 0.3s;
    }
    .btn-outline:hover { background:rgba(201,168,76,0.08); border-color:var(--gold); }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="logo.png" alt="AREWA SQUARE" onerror="this.style.display='none'"/>
      <span class="logo-name">AREWA SQUARE</span>
    </div>
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or may have been moved. Let's get you back to the marketplace.</p>
    <div class="btn-group">
      <a href="./index.html" class="btn-gold">🏠 Go Home</a>
      <a href="./buyer-dashboard.html" class="btn-outline">🛒 Browse Shops</a>
    </div>
  </div>
</body>
</html>
